<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Búsqueda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Barra superior azul claro -->
    <header class="navbar">
        <div class="menu-logo-container">
            <!-- Botón del menú (Hamburguesa) -->
            <button id="btn-menu" class="btn-menu">☰</button>
            
            <!-- Logo y Nombre en la barra -->
            <div class="brand">
                <img src="img/logo.png" alt="Logo Alerta Búsqueda" class="logo-barra">
                <h1>Alerta Búsqueda</h1>
            </div>
        </div>
    </header>

    <!-- Menú lateral (Oculto por defecto) -->
    <nav id="menu-lateral" class="menu-lateral">
        <ul>
            <li><a href="pagina1.html">Página 1</a></li>
            <li><a href="pagina2.html">Página 2</a></li>
        </ul>
    </nav>

    <main class="contenido-central">
        <div class="logo-fondo"></div>
        <h2 class="titulo-central">Alerta Búsqueda</h2>
    </main>
    <script>
        const btnMenu = document.getElementById('btn-menu');
        const menuLateral = document.getElementById('menu-lateral');

        btnMenu.addEventListener('click', () => {
            menuLateral.classList.toggle('abierto');
        });
    </script>
</body>
</html>
