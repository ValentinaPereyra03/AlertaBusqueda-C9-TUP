<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

<!-- SCRIPT DE BÚSQUEDA (Refactorizado para ocultar columnas enteras) -->
<script>
    const inputBuscador = document.getElementById('input-buscador');
    // Ahora seleccionamos la columna completa para que la grilla no se rompa al ocultarla
    const fichas = document.querySelectorAll('.col-ficha');

    inputBuscador.addEventListener('keyup', (e) => {
        const textoBusqueda = e.target.value.toLowerCase();

        fichas.forEach(ficha => {
            const textoFicha = ficha.querySelector('.texto-ficha').textContent.toLowerCase();
            if (textoFicha.includes(textoBusqueda)) {
                ficha.style.display = 'block';
            } else {
                ficha.style.display = 'none';
            }
        });
    });
</script>
