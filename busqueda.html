<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda - Alerta Búsqueda</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<header class="navbar">
    <div class="menu-logo-container">

        <button id="btn-menu" class="btn-menu">
            <span class="icono-menu">☰</span>
            <span class="texto-menu">Menú</span>
        </button>

        <div class="brand">
            <img
                src="img/logo-encabezado2 (2).png"
                alt="Logo de Alerta Búsqueda"
                class="logo-barra">
        </div>

    </div>
</header>

<nav id="menu-lateral" class="menu-lateral">
    <ul>

        <li>
            <a href="index.html">
                <i class="bi bi-house-door"></i>
                Inicio
            </a>
        </li>

        <li>
            <a href="busqueda.html">
                <i class="bi bi-search"></i>
                Búsqueda
            </a>
        </li>

        <li>
            <a href="registro.html">
       <i class="bi bi-file-earmark-text"></i>
                Registrar búsqueda
            </a>
        </li>

        <li>
            <a href="recibir.html">
                <i class="bi bi-bell"></i>
                Recibir Alertas
            </a>
        </li>

    </ul>
</nav>
    <div class="contenedor-buscador">
        <input type="text" id="input-buscador" placeholder="Buscar por nombre, apellido o zona...">
    </div>

    <main class="seccion-casos" id="contenedor-fichas">
        <a href="pagina-caso1.html" class="ficha-caso">
            <img src="img/foto-ejemplo1.jpg" alt="Foto">
            <div class="info-ficha">
                <p class="texto-ficha">Juan Pérez - Visto por última vez en Tucumán...</p>
            </div>
        </a>

        <a href="pagina-caso2.html" class="ficha-caso">
            <img src="img/foto-ejemplo2.jpg" alt="Foto">
            <div class="info-ficha">
                <p class="texto-ficha">María Gómez - Falta desde el 12/05 en Córdoba...</p>
            </div>
        </a>

        <a href="pagina-caso3.html" class="ficha-caso">
            <img src="img/foto-ejemplo3.jpg" alt="Foto">
            <div class="info-ficha">
                <p class="texto-ficha">Carlos López - Desaparecido en Buenos Aires...</p>
            </div>
        </a>
    </main>



  <script>
    const btnMenu = document.getElementById('btn-menu');
    const menuLateral = document.getElementById('menu-lateral');
    const iconoMenu = document.querySelector('.icono-menu');
    const textoMenu = document.querySelector('.texto-menu');

    function cerrarMenu() {
        menuLateral.classList.remove('abierto');

        iconoMenu.textContent = '☰';
        textoMenu.textContent = 'Menú';

        iconoMenu.classList.remove('girar');
    }

    btnMenu.addEventListener('click', () => {

        menuLateral.classList.toggle('abierto');

        if (menuLateral.classList.contains('abierto')) {

            iconoMenu.textContent = '✖';
            textoMenu.textContent = 'Cerrar';

            iconoMenu.classList.add('girar');

        } else {

            cerrarMenu();

        }

    });

    document.addEventListener('click', (event) => {

        const clickDentroMenu = menuLateral.contains(event.target);
        const clickEnBoton = btnMenu.contains(event.target);

        if (
            menuLateral.classList.contains('abierto') &&
            !clickDentroMenu &&
            !clickEnBoton
        ) {
            cerrarMenu();
        }

    });


    /* BUSCADOR */

    const inputBuscador = document.getElementById('input-buscador');
    const fichas = document.querySelectorAll('.ficha-caso');

    inputBuscador.addEventListener('keyup', (e) => {

        const textoBusqueda = e.target.value.toLowerCase();

        fichas.forEach(ficha => {

            const textoFicha =
                ficha.querySelector('.texto-ficha').textContent.toLowerCase();

            if (textoFicha.includes(textoBusqueda)) {

                ficha.style.display = 'block';

            } else {

                ficha.style.display = 'none';

            }

        });

    });
</script>
</html>
